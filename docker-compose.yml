services:
  cyber-tracker:
    image: ghcr.io/shakerrdev/cyber-tracker:latest
    build: .
    container_name: cyber-tracker
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      STEAMID64: '76561198056395137'
      TZ: Europe/Berlin
    volumes:
      - data:/data

volumes:
  data:
